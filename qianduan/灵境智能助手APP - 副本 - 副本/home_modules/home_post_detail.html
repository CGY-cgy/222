<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - 灵境智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="traditional_style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        
        .page {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8f9fa;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .back-btn:hover {
            background-color: #e9ecef;
        }
        
        .header-title {
            flex: 1;
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .post-content {
            padding: 20px 16px;
        }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            border: 2px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #8b4513;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        
        .post-time {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .post-title {
            font-size: 24px;
            font-weight: 600;
            color: #8b4513;
            margin-bottom: 16px;
            line-height: 1.4;
            padding: 12px 0;
        }
        
        .post-text {
            font-size: 16px;
            color: #5a5a5a;
            line-height: 2.0;
            margin-bottom: 24px;
            padding: 16px;
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border: 2px solid #8b4513;
            border-radius: 16px;
        }
        
        .post-image {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            margin-bottom: 24px;
            border: 2px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b4513;
            font-weight: bold;
        }
        
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 16px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            border: 2px solid #8b4513;
            border-radius: 16px;
        }
        
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border: 2px solid #8b4513;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 12px 20px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.2);
        }
        
        .action-btn i {
            font-size: 20px;
            color: #8b4513;
        }
        
        .action-btn.active i {
            color: #e74c3c;
        }
        
        .action-btn span {
            font-size: 12px;
            color: #8b4513;
            font-weight: 600;
        }
        
        .comments-section {
            padding: 0 16px;
        }
        
        .comments-title {
            font-size: 20px;
            font-weight: 600;
            color: #8b4513;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            border: 2px solid #8b4513;
            border-radius: 12px;
        }
        
        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            border: 2px solid #8b4513;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #8b4513;
            font-size: 14px;
        }
        
        .comment-content {
            flex: 1;
        }
        
        .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .comment-name {
            font-size: 14px;
            font-weight: 600;
            color: #8b4513;
        }
        
        .comment-time {
            font-size: 12px;
            color: #8b4513;
            opacity: 0.7;
        }
        
        .comment-text {
            font-size: 15px;
            color: #5a5a5a;
            line-height: 1.8;
            padding: 12px;
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border: 2px solid #8b4513;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page">
            <!-- 卷轴标题 -->
            <div class="scroll-header">
                <div class="scroll-title">帖子详情</div>
            </div>
            
            <div class="post-content">
                <div class="post-header">
                    <div class="user-avatar"></div>
                    <div class="user-info">
                        <div class="user-name">健康达人</div>
                        <div class="post-time">2小时前</div>
                    </div>
                </div>
                
                <div class="post-title">今天分享一个春季养生小技巧</div>
                
                <div class="post-text">
                    今天分享一个春季养生小技巧：多食用当季新鲜蔬菜，如菠菜、荠菜等，有助于补充维生素和矿物质，增强免疫力。
                    
                    春季是万物复苏的季节，也是人体免疫力需要提升的关键时期。通过合理的饮食搭配、适量运动和充足睡眠，可以有效提高身体免疫力。
                    
                    另外，春分时节，昼夜平分，养生要注意阴阳平衡。推荐大家每天进行15分钟的冥想，有助于调节身心，提高睡眠质量。
                </div>
                
                <div class="post-image"></div>
                
                <div class="post-actions">
                    <button class="action-btn active">
                        <i class="fas fa-heart"></i>
                        <span>128</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-comment"></i>
                        <span>36</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-share"></i>
                        <span>分享</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-bookmark"></i>
                        <span>收藏</span>
                    </button>
                </div>
                
                <div class="comments-section">
                    <div class="comments-title">评论 (36)</div>
                    
                    <div class="comment-item">
                        <div class="comment-avatar"></div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-name">养生爱好者</span>
                                <span class="comment-time">1小时前</span>
                            </div>
                            <div class="comment-text">非常实用的建议，感谢分享！</div>
                        </div>
                    </div>
                    
                    <div class="comment-item">
                        <div class="comment-avatar"></div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-name">健康小白</span>
                                <span class="comment-time">2小时前</span>
                            </div>
                            <div class="comment-text">学到了，准备试试看！</div>
                        </div>
                    </div>
                    
                    <div class="comment-item">
                        <div class="comment-avatar"></div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-name">营养师</span>
                                <span class="comment-time">3小时前</span>
                            </div>
                            <div class="comment-text">这些建议都很科学，值得推荐！</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
