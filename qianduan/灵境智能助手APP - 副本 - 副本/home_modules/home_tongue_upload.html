<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态健康画像 - 灵境智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="traditional_style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8f9fa;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .back-btn:hover {
            background-color: #e9ecef;
        }
        
        .header-title {
            flex: 1;
            font-size: 20px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .module-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        
        .module-nav::-webkit-scrollbar {
            height: 4px;
        }
        
        .module-nav::-webkit-scrollbar-thumb {
            background: rgba(139, 69, 19, 0.3);
            border-radius: 2px;
        }
        
        .nav-tab {
            padding: 10px 20px;
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border-radius: 20px;
            font-size: 14px;
            color: #8b4513;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            border: 2px solid #8b4513;
        }
        
        .nav-tab:hover {
            background: linear-gradient(135deg, #ffe4b5 0%, #f5deb3 100%);
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #fff;
            border-color: #8b4513;
        }
        
        .upload-section {
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border-radius: 16px;
            padding: 32px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.1);
            text-align: center;
            border: 2px solid #8b4513;
        }
        
        .upload-area {
            border: 2px dashed #8b4513;
            border-radius: 12px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe4b5 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: linear-gradient(135deg, #f5deb3 0%, #deb887 100%);
            border-color: #e74c3c;
        }
        
        .upload-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #fff;
            font-size: 32px;
            border: 2px solid #f5deb3;
        }
        
        .upload-text {
            font-size: 16px;
            font-weight: 500;
            color: #8b4513;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #8b4513;
        }
        
        .upload-options {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .upload-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid #8b4513;
        }
        
        .upload-btn.primary {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: #fff;
        }
        
        .upload-btn.secondary {
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            color: #8b4513;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.2);
        }
        
        .preview-section {
            display: none;
            margin-bottom: 24px;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-image {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            border: 2px solid #f5deb3;
        }
        
        .info-card {
            background: linear-gradient(135deg, #fffaf0 0%, #f5f5dc 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.1);
            border: 2px solid #8b4513;
        }
        
        .info-title {
            font-size: 16px;
            font-weight: 600;
            color: #8b4513;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-title i {
            color: #8b4513;
        }
        
        .info-text {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        
        .analyze-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #8b4513;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(139, 69, 19, 0.3);
        }
        
        .analyze-btn:disabled {
            background: linear-gradient(135deg, #d3d3d3 0%, #a9a9a9 100%);
            border-color: #808080;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page">
            <div class="header">
                <button class="back-btn" onclick="window.location.href='../home.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">动态健康画像</div>
            </div>
            
            <!-- 功能导航 -->
            <div class="module-nav">
                <div class="nav-tab active" onclick="window.location.href='home_health.html'">舌象照片上传</div>
                <div class="nav-tab" onclick="window.location.href='home_health_questionnaire.html'">健康问卷填写</div>
                <div class="nav-tab" onclick="window.location.href='home_health_portrait.html'">查看健康画像</div>
            </div>
            
            <!-- 舌象照片上传内容 -->
            <div class="upload-section">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="upload-text">点击上传舌象照片</div>
                    <div class="upload-hint">请确保照片清晰，光线充足</div>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                
                <div class="upload-options">
                    <button class="upload-btn primary" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-image"></i>
                        <span>从相册选择</span>
                    </button>
                    <button class="upload-btn secondary" onclick="openCamera()">
                        <i class="fas fa-camera"></i>
                        <span>拍照</span>
                    </button>
                </div>
            </div>
            
            <div class="preview-section" id="previewSection">
                <img id="previewImage" class="preview-image" alt="预览图片">
            </div>
            
            <div class="info-card">
                <div class="info-title">
                    <i class="fas fa-info-circle"></i>
                    <span>上传说明</span>
                </div>
                <div class="info-text">
                    <p>请上传清晰的舌象照片，确保光线充足，舌头完整可见。照片将用于健康分析，帮助您了解身体状况。</p>
                </div>
            </div>
            
            <div class="info-card">
                <div class="info-title">
                    <i class="fas fa-shield-alt"></i>
                    <span>隐私保护</span>
                </div>
                <div class="info-text">
                    您的照片仅用于分析，我们承诺不会保存或泄露您的个人信息。分析完成后，您可以选择删除照片。
                </div>
            </div>
            
            <button class="analyze-btn" id="analyzeBtn" disabled onclick="startAnalysis()">
                开始分析
            </button>
        </div>
    </div>
    
    <script>
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewSection').classList.add('active');
                    document.getElementById('analyzeBtn').disabled = false;
                };
                reader.readAsDataURL(file);
            }
        }
        
        function openCamera() {
            document.getElementById('fileInput').setAttribute('capture', 'environment');
            document.getElementById('fileInput').click();
        }
        
        function startAnalysis() {
            alert('分析功能开发中，请稍候...');
        }
    </script>
</body>
</html>
