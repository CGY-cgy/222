<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵境智能助手 - 会员权益</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../member-common.css">
    <style>
        /* 会员权益页面样式 */
        
        /* 权益对比表格样式 */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .comparison-table th, .comparison-table td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .comparison-table th {
            background-color: #f8f9fa;
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }
        
        .comparison-table td {
            font-size: 14px;
            color: #495057;
        }
        
        .comparison-table tr:last-child td {
            border-bottom: none;
        }
        
        /* 功能名称样式 */
        .feature-name {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }
        
        .feature-icon {
            font-size: 16px;
            color: #3498db;
        }
        
        /* 功能可用性样式 */
        .available {
            color: #27ae60;
            font-size: 16px;
        }
        
        .unavailable {
            color: #e74c3c;
            font-size: 16px;
        }
        
        /* 限制说明样式 */
        .limited {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 4px;
        }
        
        /* 会员专享权益区域 */
        .exclusive-benefits {
            margin-bottom: 24px;
        }
        
        .benefit-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .benefit-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            background-color: #f8f9fa;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .benefit-item:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }
        
        .benefit-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .benefit-item-content {
            flex: 1;
        }
        
        .benefit-item-title {
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        
        .benefit-item-desc {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        /* 购买按钮样式 */
        .buy-member-btn {
            width: 100%;
            padding: 14px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }
        
        .buy-member-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 会员权益页面内容 -->
        <div class="page active" id="page-content">
            <!-- 页面头部 -->
            <div class="page-header">
                <button class="back-btn" title="返回" onclick="window.location.href='member.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="page-title" style="font-size: 16px; text-align: center; width: 100%;">会员权益</div>
              
            </div>
            
            <!-- 权益对比表格 -->
            <div class="privileges-section">
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>功能</th>
                            <th>免费用户</th>
                            <th>会员用户</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-robot feature-icon"></i>
                                    <span>AI智能对话</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（每日5次）</span>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（无限次）</span>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-heartbeat feature-icon"></i>
                                    <span>健康分析报告</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-times unavailable"></i>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-star feature-icon"></i>
                                    <span>星座运势查询</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（每日1次）</span>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（无限次）</span>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-book-open feature-icon"></i>
                                    <span>精品课程</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（免费专区）</span>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（全部课程）</span>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-magic feature-icon"></i>
                                    <span>高级功能</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-times unavailable"></i>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-bell feature-icon"></i>
                                    <span>专属提醒</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-times unavailable"></i>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-shield-alt feature-icon"></i>
                                    <span>数据备份</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（7天）</span>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（30天）</span>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="feature-name">
                                    <i class="fas fa-user-secret feature-icon"></i>
                                    <span>隐私保护</span>
                                </div>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（基础）</span>
                            </td>
                            <td>
                                <i class="fas fa-check available"></i>
                                <span class="limited">（高级）</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 会员专享权益 -->
            <div class="exclusive-benefits">
                <div class="section-title">会员专享</div>
                <div class="benefit-list">
                    <div class="benefit-item">
                        <div class="benefit-item-icon">
                            <i class="fas fa-gift"></i>
                        </div>
                        <div class="benefit-item-content">
                            <div class="benefit-item-title">生日礼包</div>
                            <div class="benefit-item-desc">会员生日当月可领取专属生日礼包，包含多种特权和优惠</div>
                        </div>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-item-icon">
                            <i class="fas fa-percentage"></i>
                        </div>
                        <div class="benefit-item-content">
                            <div class="benefit-item-title">专属折扣</div>
                            <div class="benefit-item-desc">会员购买平台商品可享受9折优惠，部分商品低至8折</div>
                        </div>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-item-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="benefit-item-content">
                            <div class="benefit-item-title">会员社区</div>
                            <div class="benefit-item-desc">加入专属会员社区，与其他会员交流分享经验</div>
                        </div>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-item-icon">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="benefit-item-content">
                            <div class="benefit-item-title">专属客服</div>
                            <div class="benefit-item-desc">享受24小时专属客服服务，优先解决问题</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 立即开通按钮 -->
            <button class="buy-member-btn" onclick="window.location.href='member_purchase.html'">
                <i class="fas fa-crown"></i> 立即开通会员
            </button>
        </div>
        
     
        
        <script src="../member-common.js"></script>
    </div>
</body>
</html>
