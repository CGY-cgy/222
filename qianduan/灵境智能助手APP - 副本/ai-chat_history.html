<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史对话 - 灵境AI助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
        }

        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* 顶部栏 */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2c3e50;
        }

        .header-title {
            font-size: 18px;
            font-weight: 500;
        }

        /* 搜索框 */
        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            background-color: #f8f9fa;
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
        }

        /* 历史列表 */
        .history-list {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background-color: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .history-item:hover {
            background-color: #e9ecef;
        }

        .history-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
        }

        .history-content {
            flex: 1;
        }

        .history-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .history-preview {
            font-size: 12px;
            color: #7f8c8d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-time {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 8px;
            flex-shrink: 0;
        }

        /* 空状态 */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 14px;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- 顶部 -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-title">历史对话</div>
    </div>

    <!-- 搜索 -->
    <div class="search-box">
        <input class="search-input" placeholder="搜索历史对话关键词">
    </div>

    <!-- 历史列表 -->
    <div class="history-list">

        <div class="history-item" onclick="openChat()">
            <div class="history-icon">
                <i class="fas fa-star"></i>
            </div>
            <div class="history-content">
                <div class="history-title">今日运势分析</div>
                <div class="history-preview">今天整体运势良好，适合开始新计划...</div>
            </div>
            <div class="history-time">10:30</div>
        </div>

        <div class="history-item" onclick="openChat()">
            <div class="history-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="history-content">
                <div class="history-title">健康饮食建议</div>
                <div class="history-preview">建议多摄入清淡食物，保持作息规律...</div>
            </div>
            <div class="history-time">昨天</div>
        </div>

        <div class="history-item" onclick="openChat()">
            <div class="history-icon">
                <i class="fas fa-hand-holding-heart"></i>
            </div>
            <div class="history-content">
                <div class="history-title">情感分析</div>
                <div class="history-preview">你目前在情感上更需要安全感与沟通...</div>
            </div>
            <div class="history-time">2天前</div>
        </div>

    </div>
</div>

<script>
    function openChat() {
        // 后期可携带 sessionId
        window.location.href = 'ai-chat.html';
    }
</script>
</body>
</html>
