<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康画像 - 灵境智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8f9fa;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .back-btn:hover {
            background-color: #e9ecef;
        }
        
        .header-title {
            flex: 1;
            font-size: 20px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .module-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        
        .module-nav::-webkit-scrollbar {
            height: 4px;
        }
        
        .module-nav::-webkit-scrollbar-thumb {
            background: rgba(46, 128, 204, 0.3);
            border-radius: 2px;
        }
        
        .nav-tab {
            padding: 10px 20px;
            background-color: #f8f9fa;
            border-radius: 20px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            border: 2px solid transparent;
        }
        
        .nav-tab:hover {
            background-color: #e9ecef;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg,  #3498db, #2980b9);
            color: #fff;
            border-color: #3498db;
        }
        
        .overview-card {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            color: #fff;
        }
        
        .overview-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        
        .health-score {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#2eccb7 75%, rgba(255,255,255,0.2) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            position: relative;
        }
        
        .score-inner {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .score-number {
            font-size: 32px;
            font-weight: 700;
            color: #2eccbf;
        }
        
        .score-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .health-summary {
            text-align: center;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background-color: #34495e;
            border-radius: 2px;
        }
        
        .info-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-size: 14px;
            color: #2c3e50;
        }
        
        .info-value {
            font-size: 14px;
            font-weight: 500;
            color: #34495e;
        }
        
        .health-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .health-item-card {
            background-color: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .health-item-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            flex-shrink: 0;
        }
        
        .health-item-icon.overview {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        
        .health-item-icon.constitution {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        .health-item-icon.advice {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        
        .health-item-content {
            flex: 1;
        }
        
        .health-item-title {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        
        .health-item-desc {
            font-size: 13px;
            color: #7f8c8d;
            line-height: 1.5;
        }
        
        .recommendation-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .recommendation-title {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .recommendation-title i {
            color: #2ecc71;
        }
        
        .recommendation-list {
            list-style: none;
        }
        
        .recommendation-list li {
            padding: 10px 0;
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.6;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .recommendation-list li:last-child {
            border-bottom: none;
        }
        
        .recommendation-list li::before {
            content: '•';
            color: #2ecc71;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            height: 60px;
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 8px 0;
            flex: 1;
        }
        
        .nav-item i {
            font-size: 20px;
            color: #7f8c8d;
        }
        
        .nav-item span {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .nav-item.active i, .nav-item.active span {
            color: #2ecc71;
        }
        
        .publish-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        .publish-icon {
            position: absolute;
            bottom: 10px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .publish-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.4);
        }
        
        .publish-icon i {
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page">
            <div class="header">
                <button class="back-btn" onclick="window.location.href='../home.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">动态健康画像</div>
            </div>
            
            <!-- 功能导航 -->
            <div class="module-nav">
                <div class="nav-tab" onclick="window.location.href='home_tongue_upload.html'">舌象照片上传</div>
                <div class="nav-tab" onclick="window.location.href='home_health_questionnaire.html'">健康问卷填写</div>
                <div class="nav-tab active" onclick="window.location.href='home_health_portrait.html'">查看健康画像</div>
            </div>
            
            <div class="overview-card">
                <div class="overview-title">整体健康状况</div>
                <div class="health-score">
                    <div class="score-circle">
                        <div class="score-inner">
                            <div class="score-number">75</div>
                            <div class="score-label">健康分</div>
                        </div>
                    </div>
                    <div class="health-summary">您的整体健康状况良好，建议继续保持良好的生活习惯</div>
                </div>
            </div>
            
            <div class="health-grid">
                <div class="health-item-card" onclick="window.location.href='home_health_portrait.html'">
                    <div class="health-item-icon overview">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="health-item-content">
                        <div class="health-item-title">整体健康状况</div>
                        <div class="health-item-desc">健康分75分，整体状况良好，建议继续保持</div>
                    </div>
                 
                </div>
                
                <div class="health-item-card" onclick="window.location.href='home_health_portrait.html'">
                    <div class="health-item-icon constitution">
                        <i class="fas fa-user-md"></i>
                    </div>
                    <div class="health-item-content">
                        <div class="health-item-title">体质分析</div>
                        <div class="health-item-desc">平和质，评分82分，精力充沛，睡眠良好</div>
                    </div>
                </div>
                
                <div class="health-item-card" onclick="window.location.href='home_health_portrait.html'">
                    <div class="health-item-icon advice">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                    <div class="health-item-content">
                        <div class="health-item-title">健康建议</div>
                        <div class="health-item-desc">个性化建议：规律作息、适量运动、饮食清淡</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-nav">
            <div class="nav-item active" onclick="window.location.href='../home.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../ai-chat.html'">
                <i class="fas fa-robot"></i>
                <span>AI助手</span>
            </div>
            <div class="nav-item publish-btn-wrapper" onclick="window.location.href='../publish-post.html'">
                <div class="publish-icon">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            <div class="nav-item" onclick="window.location.href='../member.html'">
                <i class="fas fa-crown"></i>
                <span>会员</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>
    
</body>
</html>
