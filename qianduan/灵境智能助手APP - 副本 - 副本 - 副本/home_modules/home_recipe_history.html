<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史推荐 - 灵境智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8f9fa;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .back-btn:hover {
            background-color: #e9ecef;
        }
        
        .header-title {
            flex: 1;
            font-size: 20px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .module-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        
        .module-nav::-webkit-scrollbar {
            height: 4px;
        }
        
        .module-nav::-webkit-scrollbar-thumb {
            background: rgba(18, 112, 243, 0.3);
            border-radius: 2px;
        }
        
        .nav-tab {
            padding: 10px 20px;
            background-color: #f8f9fa;
            border-radius: 20px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            border: 2px solid transparent;
        }
        
        .nav-tab:hover {
            background-color: #e9ecef;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg,  #3498db, #2980b9);
            color: #fff;
            border-color: #3498db;
        }
        
        .date-section {
            margin-bottom: 20px;
        }
        
        .date-header {
            font-size: 14px;
            font-weight: 500;
            color: #7f8c8d;
            margin-bottom: 12px;
            padding-left: 4px;
        }
        
        .recipe-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .recipe-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            gap: 12px;
        }
        
        .recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        
        .recipe-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            flex-shrink: 0;
            position: relative;
        }
        
        .recipe-image::after {
            content: '🥗';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
        }
        
        .recipe-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .recipe-title {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .recipe-desc {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .recipe-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .recipe-meta i {
            color: #6ba3d1;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        
        .empty-state i {
            font-size: 64px;
            color: #bdc3c7;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            height: 60px;
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 8px 0;
            flex: 1;
        }
        
        .nav-item i {
            font-size: 20px;
            color: #7f8c8d;
        }
        
        .nav-item span {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .nav-item.active i, .nav-item.active span {
            color: #6ba3d1;
        }
        
        .publish-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        .publish-icon {
            position: absolute;
            bottom: 10px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2e7ab8, #5696c7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .publish-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.4);
        }
        
        .publish-icon i {
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page">
            <div class="header">
                <button class="back-btn" onclick="window.location.href='../home.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="header-title">智能饮食推荐</div>
            </div>
            
            <!-- 功能导航 -->
            <div class="module-nav">
                <div class="nav-tab" onclick="window.location.href='home_recipe.html'">推荐食谱</div>
                <div class="nav-tab" onclick="window.location.href='home_diet_settings.html'">设置饮食禁忌</div>
                <div class="nav-tab" onclick="window.location.href='home_dos_donts.html'">今日宜忌</div>
                <div class="nav-tab active" onclick="window.location.href='home_recipe_history.html'">历史推荐</div>
            </div>
            
            <div class="date-section">
                <div class="date-header">今天 (3月20日)</div>
                <div class="recipe-list">
                    <div class="recipe-card" onclick="window.location.href='home_recipe_detail.html'">
                        <div class="recipe-image"></div>
                        <div class="recipe-info">
                            <div class="recipe-title">春分养生汤</div>
                            <div class="recipe-desc">滋阴润燥，适合春季食用</div>
                            <div class="recipe-meta">
                                <span><i class="fas fa-fire"></i> 350 卡路里</span>
                                <span><i class="fas fa-clock"></i> 30分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="date-section">
                <div class="date-header">昨天 (3月19日)</div>
                <div class="recipe-list">
                    <div class="recipe-card" onclick="window.location.href='home_recipe_detail.html'">
                        <div class="recipe-image"></div>
                        <div class="recipe-info">
                            <div class="recipe-title">春季排毒餐</div>
                            <div class="recipe-desc">清肠排毒，提高免疫力</div>
                            <div class="recipe-meta">
                                <span><i class="fas fa-fire"></i> 280 卡路里</span>
                                <span><i class="fas fa-clock"></i> 25分钟</span>
                            </div>
                        </div>
                    </div>
                    <div class="recipe-card" onclick="window.location.href='home_recipe_detail.html'">
                        <div class="recipe-image"></div>
                        <div class="recipe-info">
                            <div class="recipe-title">养颜美容粥</div>
                            <div class="recipe-desc">滋养肌肤，延缓衰老</div>
                            <div class="recipe-meta">
                                <span><i class="fas fa-fire"></i> 320 卡路里</span>
                                <span><i class="fas fa-clock"></i> 40分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="date-section">
                <div class="date-header">3月18日</div>
                <div class="recipe-list">
                    <div class="recipe-card" onclick="window.location.href='home_recipe_detail.html'">
                        <div class="recipe-image"></div>
                        <div class="recipe-info">
                            <div class="recipe-title">春季润燥汤</div>
                            <div class="recipe-desc">润肺养阴，适合干燥季节</div>
                            <div class="recipe-meta">
                                <span><i class="fas fa-fire"></i> 380 卡路里</span>
                                <span><i class="fas fa-clock"></i> 35分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-nav">
            <div class="nav-item active" onclick="window.location.href='../home.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../ai-chat.html'">
                <i class="fas fa-robot"></i>
                <span>AI助手</span>
            </div>
            <div class="nav-item publish-btn-wrapper" onclick="window.location.href='../publish-post.html'">
                <div class="publish-icon">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            <div class="nav-item" onclick="window.location.href='../member.html'">
                <i class="fas fa-crown"></i>
                <span>会员</span>
            </div>
            <div class="nav-item" onclick="window.location.href='../profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
