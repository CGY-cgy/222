<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础信息编辑 - 灵境智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        
        /* 页面通用样式 */
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        /* 顶部导航栏 */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-title {
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 16px;
        }
        
        .nav-btn:hover {
            background-color: #f0f0f0;
        }
        
        /* 表单样式 */
        .form-section {
            background-color: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            color: #2c3e50;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }
        
        /* 头像上传样式 */
        .avatar-section {
            text-align: center;
            margin-bottom: 24px;
        }
        
        #avatarPreview {
            position: relative;
            display: inline-block;
        }
        
        .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #999;
        }
        
        #avatarPreview img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #3498db;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 14px;
        }
        
        .avatar-upload-btn:hover {
            background-color: #2980b9;
        }
        
        #avatarInput {
            display: none;
        }
        
        /* 性别选择样式 */
        .gender-options {
            display: flex;
            gap: 16px;
        }
        
        .gender-option {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .gender-option.active {
            border-color: #3498db;
            background-color: rgba(52, 152, 219, 0.1);
        }
        
        .gender-option i {
            font-size: 20px;
            margin-bottom: 4px;
            color: #666;
        }
        
        .gender-option.active i {
            color: #3498db;
        }
        
        .gender-text {
            font-size: 14px;
            color: #666;
        }
        
        .gender-option.active .gender-text {
            color: #3498db;
        }
        
        /* 保存按钮 */
        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }
        
        .save-btn:hover {
            background-color: #2980b9;
        }
        
        .save-btn:active {
            transform: scale(0.98);
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            height: 60px;
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 8px 0;
            flex: 1;
        }
        
        .nav-item i {
            font-size: 20px;
            color: #7f8c8d;
        }
        
        .nav-item span {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .nav-item.active i, .nav-item.active span {
            color: #3498db;
        }
        
        .publish-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        .publish-icon {
            position: absolute;
            bottom: 10px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .publish-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.4);
        }
        
        .publish-icon i {
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <div class="top-nav">
            <button class="nav-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="nav-title">编辑个人资料</div>
            <button class="nav-btn" onclick="saveChanges()">
                <i class="fas fa-check"></i>
            </button>
        </div>
        
        <!-- 基础信息编辑表单 -->
        <div class="page">
            <!-- 头像上传 -->
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">头像</label>
                    <div class="avatar-section">
                        <div id="avatarPreview">
                            <div class="avatar-placeholder">
                                <i class="fas fa-user"></i>
                            </div>
                            <label for="avatarInput" class="avatar-upload-btn">
                                <i class="fas fa-camera"></i>
                            </label>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*">
                    </div>
                </div>
                
                <!-- 昵称修改 -->
                <div class="form-group">
                    <label for="nickname" class="form-label">昵称</label>
                    <input type="text" id="nickname" class="form-input" placeholder="请输入昵称">
                </div>
                
                <!-- 性别选择 -->
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <div class="gender-options">
                        <div class="gender-option active" onclick="selectGender('male')">
                            <i class="fas fa-mars"></i>
                            <div class="gender-text">男</div>
                        </div>
                        <div class="gender-option" onclick="selectGender('female')">
                            <i class="fas fa-venus"></i>
                            <div class="gender-text">女</div>
                        </div>
                        <div class="gender-option" onclick="selectGender('other')">
                            <i class="fas fa-genderless"></i>
                            <div class="gender-text">保密</div>
                        </div>
                    </div>
                </div>
                
                <!-- 生日选择 -->
                <div class="form-group">
                    <label for="birthday" class="form-label">生日</label>
                    <input type="date" id="birthday" class="form-input">
                </div>
            </div>
        </div>
        
        <!-- 底部导航栏 -->
        <div class="bottom-nav">
            <div class="nav-item" data-page="home">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" data-page="ai-chat">
                <i class="fas fa-robot"></i>
                <span>AI助手</span>
            </div>
            <div class="nav-item publish-btn-wrapper" data-page="publish-post">
                <div class="publish-icon">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            <div class="nav-item" data-page="member">
                <i class="fas fa-crown"></i>
                <span>会员</span>
            </div>
            <div class="nav-item active" data-page="profile">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>
    
    <script>
        // 返回上一页
        function goBack() {
            window.location.href = '../profile.html';
        }
        
        // 头像上传预览
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const avatarPreview = document.getElementById('avatarPreview');
                    const placeholder = avatarPreview.querySelector('.avatar-placeholder');
                    if (placeholder) placeholder.remove();
                    let img = avatarPreview.querySelector('img') || document.createElement('img');
                    img.src = event.target.result;
                    avatarPreview.insertBefore(img, avatarPreview.querySelector('.avatar-upload-btn'));
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 性别选择
        function selectGender(gender) {
            const options = document.querySelectorAll('.gender-option');
            options.forEach(option => option.classList.remove('active'));
            
            if (gender === 'male') {
                options[0].classList.add('active');
            } else if (gender === 'female') {
                options[1].classList.add('active');
            } else {
                options[2].classList.add('active');
            }
        }
        
        // 保存修改
        function saveChanges() {
            const nickname = document.getElementById('nickname').value;
            const birthday = document.getElementById('birthday').value;
            const gender = document.querySelector('.gender-option.active').querySelector('.gender-text').textContent;
            
            // 表单验证
            if (!nickname) {
                alert('请输入昵称');
                return;
            }
            
            // 构建数据对象
            const userData = {
                nickname: nickname,
                gender: gender,
                birthday: birthday
                // 头像数据可以在这里处理
            };
            
            // 模拟数据提交
            console.log('保存的用户数据:', userData);
            
            // 保存成功提示
            alert('个人信息保存成功');
            goBack();
        }
        
        // 初始化页面数据
        function init() {
            // 这里可以从localStorage或服务器获取用户数据并填充表单
            const savedData = localStorage.getItem('userProfile');
            if (savedData) {
                const userData = JSON.parse(savedData);
                if (userData.nickname) {
                    document.getElementById('nickname').value = userData.nickname;
                }
                if (userData.birthday) {
                    document.getElementById('birthday').value = userData.birthday;
                }
                if (userData.gender) {
                    if (userData.gender === '男') {
                        selectGender('male');
                    } else if (userData.gender === '女') {
                        selectGender('female');
                    } else {
                        selectGender('other');
                    }
                }
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
    
    <!-- 引入外部JavaScript文件 -->
    <script src="../script.js"></script>
    <script src="../member-common.js"></script>
</body>
</html>
